<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body class="login-body">
    <main class="login-container">
      <section class="login-card">
        <header class="login-header">
          <p class="login-tag">Cola Feed</p>
          <h1>登录</h1>
          <p class="login-subtitle">登录后可记录喂奶，管理员可查看客户端状态</p>
        </header>

        <form id="loginForm" class="login-form" novalidate>
          <label class="login-field" for="userName">
            <span>用户名</span>
            <input
              id="userName"
              name="userName"
              type="text"
              autocomplete="username"
              maxlength="64"
              placeholder="请输入用户名"
              required
            />
          </label>

          <label class="login-field" for="password">
            <span>密码</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="64"
              placeholder="请输入密码"
              required
            />
          </label>

          <p id="loginError" class="login-error" role="alert" hidden></p>

          <button id="loginBtn" class="login-btn" type="submit">登录</button>
          <p class="login-note">密码经 RSA-OAEP 加密后提交，不会以明文传输</p>
        </form>
      </section>
    </main>

    <script src="/vendor/jsencrypt.min.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
